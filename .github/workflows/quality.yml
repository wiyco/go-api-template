name: Quality
on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  golangci:
    name: golangci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint checks
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
