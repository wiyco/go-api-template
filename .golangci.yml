version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  default: standard
  enable:
    - lll
    - misspell
  settings:
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
